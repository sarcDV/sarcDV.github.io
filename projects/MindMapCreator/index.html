<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>JSON → Workflow Diagram</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body class="dark">

  <h2>JSON → Workflow / Mind‑Map Diagram</h2>

  <div id="controls">
    <input type="file" id="fileInput" accept=".json">
    <input type="text" id="searchBox" placeholder="Search nodes...">
    <button id="themeToggle">Toggle Mode</button>
    <button id="toggleLayout">Switch Layout</button>
    <button id="zoomIn">Zoom In</button>
    <button id="zoomOut">Zoom Out</button>
    <button id="resetZoom">Reset Zoom</button>
    <button id="collapseAll">Collapse All</button>
    <button id="expandAll">Expand All</button>
    <button id="exportSVG">Export SVG</button>
    <button id="exportPNG">Export PNG</button>
  </div>

  <svg id="graph"></svg>

  <script src="main.js"></script>
</body>
</html>
