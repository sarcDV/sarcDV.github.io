<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Wave Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="controls">
        <h1>Water Wave Sim</h1>
        <label>Propagation Speed: <input type="range" id="speed" min="0.1" max="2" step="0.1" value="1"></label>
        <label>Damping: <input type="range" id="damping" min="0.9" max="0.99" step="0.005" value="0.98"></label>
        <label>Wave Frequency: <input type="range" id="frequency" min="1" max="20" step="1" value="10"></label>
        <p>Click/Move to disturb the water</p>
    </div>
    <canvas id="canvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
