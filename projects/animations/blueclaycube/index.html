<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Clay Cube — Animated</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 35%, #cfcac3 0%, #a49b8d 55%, #7d7566 100%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  canvas { display: block; }
  .hud {
    position: fixed; left: 20px; top: 18px; color: #3c3830;
    text-shadow: 0 1px 0 rgba(255,255,255,.35); user-select: none; pointer-events: none;
  }
  .hud h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .3px; }
  .hud p  { margin: 4px 0 0; font-size: 12px; opacity: .75; }

  /* ---------- reference photo card (top-right) ---------- */
  .ref {
    position: fixed; top: 16px; right: 16px; margin: 0; z-index: 10;
    width: 180px; border-radius: 14px; overflow: hidden;
    background: #fff; cursor: pointer;
    box-shadow: 0 8px 28px rgba(0,0,0,.35), 0 0 0 2px rgba(255,255,255,.5);
    user-select: none; transition: width .25s ease;
  }
  .ref img {
    display: block; width: 100%; aspect-ratio: 4 / 3;
    object-fit: cover; background: #ddd;
  }
  .ref figcaption {
    font-size: 11px; text-align: center; padding: 5px 6px 7px;
    color: #3c3830; background: #f4f1ea; letter-spacing: .3px;
  }
  .ref .drop {
    display: none; padding: 16px 10px; text-align: center;
    font-size: 12px; line-height: 1.5; color: #6b6458;
    background: #f4f1ea; cursor: pointer;
  }
  .ref.empty img { display: none; }
  .ref.empty .drop { display: block; }
  .ref.dragover { outline: 3px dashed #1e90ff; outline-offset: -3px; }
  .ref.big { width: min(72vw, 460px); }
  @media (max-width: 640px) {
    .ref { width: 118px; }
    .ref.big { width: min(82vw, 460px); }
  }
</style>
</head>
<body>
<div class="hud">
  <h1>Blue Clay Cube</h1>
  <p>6 boolean-cut hemisphere holes &bull; drag to orbit &bull; scroll to zoom</p>
</div>

<!-- reference photo card -->
<figure class="ref" id="refCard" title="Original reference photo">
  <img id="refImg" src="cube.jpg" alt="Original blue clay cube photo">
  <label class="drop" for="refFile">
    📷 original photo not found<br>
    <b>click to choose</b> or drag &amp; drop it here<br>
    <span style="opacity:.6">(or save it as cube.jpg next to this file)</span>
  </label>
  <input type="file" id="refFile" accept="image/*" hidden>
  <figcaption>original &bull; click to enlarge</figcaption>
</figure>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.0/build/index.module.js",
    "three-bvh-csg": "https://unpkg.com/three-bvh-csg@0.0.16/build/index.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';

/* ---------- reference photo card logic ---------- */
const refCard = document.getElementById('refCard');
const refImg  = document.getElementById('refImg');
const refFile = document.getElementById('refFile');

refImg.addEventListener('error', () => refCard.classList.add('empty'), { once: true });
refImg.addEventListener('load',  () => refCard.classList.remove('empty'));

function setPhoto(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => { refImg.src = e.target.result; refCard.classList.remove('empty'); };
  reader.readAsDataURL(file);
}
refFile.addEventListener('change', () => setPhoto(refFile.files[0]));

refCard.addEventListener('dragover', e => { e.preventDefault(); refCard.classList.add('dragover'); });
refCard.addEventListener('dragleave', () => refCard.classList.remove('dragover'));
refCard.addEventListener('drop', e => {
  e.preventDefault(); refCard.classList.remove('dragover');
  setPhoto(e.dataTransfer.files[0]);
});
refCard.addEventListener('click', e => {
  if (e.target.closest('.drop')) return;      // that click opens the file picker
  refCard.classList.toggle('big');            // otherwise enlarge / shrink
});

/* ---------- renderer / scene / camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb7b2aa, 16, 38);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.4, 3.4, 5.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.55;

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xeaf6ff, 0x8a7f6d, 0.9));

const sun = new THREE.DirectionalLight(0xfff2dd, 2.4);
sun.position.set(5, 9, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -8;
sun.shadow.camera.right = sun.shadow.camera.top = 8;
sun.bias = -0.0004;
scene.add(sun);

const rim = new THREE.DirectionalLight(0xbfe4ff, 0.6);
rim.position.set(-6, 4, -5);
scene.add(rim);

/* ---------- fabric-like ground ---------- */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 48).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x948a7a, roughness: 1 })
);
ground.receiveShadow = true;
scene.add(ground);

/* ---------- procedural cracked-clay texture ---------- */
function makeClayTexture(size = 1024) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');

  const base = g.createLinearGradient(0, 0, size, size);
  base.addColorStop(0, '#189ae8');
  base.addColorStop(0.5, '#1e90ff');
  base.addColorStop(1, '#158fe0');
  g.fillStyle = base;
  g.fillRect(0, 0, size, size);

  for (let i = 0; i < 260; i++) {
    const x = Math.random() * size, y = Math.random() * size, r = 20 + Math.random() * 90;
    const lg = g.createRadialGradient(x, y, 0, x, y, r);
    lg.addColorStop(0, Math.random() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,40,90,0.06)');
    lg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = lg;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }

  g.strokeStyle = 'rgba(255,255,255,0.06)';
  for (let i = 0; i < 150; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const r = 6 + Math.random() * 18, a0 = Math.random() * Math.PI * 2;
    g.lineWidth = 1 + Math.random();
    g.beginPath(); g.arc(x, y, r, a0, a0 + 1 + Math.random() * 1.5); g.stroke();
  }

  function crack(x, y, ang, len, w) {
    g.strokeStyle = 'rgba(8,25,60,0.85)';
    g.lineCap = g.lineJoin = 'round';
    g.lineWidth = w;
    g.beginPath(); g.moveTo(x, y);
    let px = x, py = y, a = ang;
    const steps = Math.floor(len / 6);
    for (let s = 0; s < steps; s++) {
      a += (Math.random() - 0.5) * 0.9;
      px += Math.cos(a) * 6; py += Math.sin(a) * 6;
      g.lineTo(px, py);
      if (Math.random() < 0.06 && w > 1.2)
        crack(px, py, a + (Math.random() < .5 ? 1 : -1) * (0.9 + Math.random() * 0.6), len * 0.35, w * 0.6);
    }
    g.stroke();
  }
  for (let i = 0; i < 14; i++)
    crack(Math.random() * size, Math.random() * size, Math.random() * Math.PI * 2,
          200 + Math.random() * 400, 2.5 + Math.random() * 2.5);

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const clayTex = makeClayTexture();

const clay = new THREE.MeshStandardMaterial({
  map: clayTex,
  bumpMap: clayTex,
  bumpScale: 0.35,
  roughness: 0.95,
  metalness: 0,
  side: THREE.DoubleSide
});

/* ---------- cube with 6 real hemisphere holes (CSG subtraction) ---------- */
const SIZE = 2.6, HALF = SIZE / 2;
const HOLE_R = 0.9;

const base = new Brush(new RoundedBoxGeometry(SIZE, SIZE, SIZE, 24, 0.45), clay);
base.updateMatrixWorld(true);

const evaluator = new Evaluator();
evaluator.useGroups = false;

const sphereGeo = new THREE.SphereGeometry(HOLE_R, 64, 48);
const centers = [
  [ HALF, 0, 0], [-HALF, 0, 0],
  [0,  HALF, 0], [0, -HALF, 0],
  [0, 0,  HALF], [0, 0, -HALF]
];

let cube = base;
for (const [x, y, z] of centers) {
  const cutter = new Brush(sphereGeo, clay);
  cutter.position.set(x, y, z);
  cutter.updateMatrixWorld(true);
  cube = evaluator.evaluate(cube, cutter, SUBTRACTION);
  cube.updateMatrixWorld(true);
}
cube.castShadow = true;
cube.position.y = 1.6;
scene.add(cube);

/* ---------- animation ---------- */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  cube.rotation.y = t * 0.5;
  cube.rotation.x = Math.sin(t * 0.6) * 0.35;
  cube.rotation.z = Math.sin(t * 0.4) * 0.15;
  cube.position.y = 1.6 + Math.sin(t * 1.2) * 0.08;
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
