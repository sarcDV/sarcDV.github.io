<!DOCTYPE html>
<html lang="it" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive CV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script src="data.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    #side-panel {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #side-panel.closed {
      transform: translateX(100%);
    }
  </style>
</head>
<body class="h-full w-full overflow-hidden text-slate-100 flex relative">

  <!-- Area Mappa Vis.js -->
  <main class="flex-1 h-full relative">
    <div id="network-container" class="w-full h-full bg-slate-950"></div>
  </main>

  <!-- Pannello Laterale Dettagli -->
  <aside id="side-panel" class="fixed top-0 right-0 w-full md:w-[450px] h-full bg-slate-900/95 backdrop-blur-xl border-l border-slate-800 shadow-2xl z-50 flex flex-col closed">
    
    <!-- Header Pannello -->
    <div class="p-6 border-b border-slate-800 flex items-start justify-between bg-slate-900/50">
      <div>
        <h2 id="panel-title" class="text-xl font-bold text-slate-100 leading-tight">Loading / Caricamento...</h2>
        <p id="panel-subtitle" class="text-xs font-semibold text-indigo-400 mt-1 uppercase tracking-wider"></p>
      </div>
      <button id="close-btn" class="p-2 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-800 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Contenuto Scorrevole -->
    <div class="flex-1 overflow-y-auto p-6 space-y-6">
      <!-- Tag -->
      <div>
        <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Competenze & Topic</h3>
        <div id="panel-tags" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- Descrizione (EN / IT) -->
      <div>
        <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Dettagli</h3>
        <div id="panel-summary" class="space-y-4"></div>
      </div>

      <!-- Link Esterni -->
      <div>
        <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Risorse</h3>
        <div id="panel-links" class="space-y-2"></div>
      </div>
    </div>

  </aside>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('network-container');

      // 1. Palette Colori e Stili dei Gruppi (Rettangolari - 'box')
      const groupStyles = {
        root: {
          shape: 'box',
          margin: 14,
          color: { background: '#0f172a', border: '#6366f1', highlight: { background: '#312e81', border: '#818cf8' } },
          font: { color: '#f1f5f9', face: 'Inter', size: 16, bold: true }
        },
        area: {
          shape: 'box',
          margin: 12,
          color: { background: '#0f172a', border: '#38bdf8', highlight: { background: '#1e293b', border: '#7dd3fc' } },
          font: { color: '#f1f5f9', face: 'Inter', size: 14 }
        },
        experience: {
          shape: 'box',
          margin: 10,
          color: { background: '#064e3b', border: '#34d399', highlight: { background: '#065f46', border: '#6ee7b7' } },
          font: { color: '#ecfdf5', face: 'Inter', size: 13 }
        },
        skill: {
          shape: 'box',
          margin: 10,
          color: { background: '#312e81', border: '#a855f7', highlight: { background: '#3b0764', border: '#c084fc' } },
          font: { color: '#f3e8ff', face: 'Inter', size: 12 }
        }
      };

      // 2. Mappatura Dataset con forma rettangolare forzata per qualsiasi nodo
      const nodesArray = graphData.nodes.map(node => {
        const groupStyle = groupStyles[node.group] || {};
        return {
          shape: 'box', // Forziamo la forma rettangolare
          margin: 12,
          ...groupStyle,
          ...node,
          hidden: false
        };
      });

      const nodesDataSet = new vis.DataSet(nodesArray);
      const edgesDataSet = new vis.DataSet(graphData.edges);

      const data = { nodes: nodesDataSet, edges: edgesDataSet };

      // 3. Opzioni di Layout Gerarchico con Spaziatura Generosa
      const options = {
        nodes: {
          shape: 'box',
          borderWidth: 1.5,
          borderWidthSelected: 2.5,
          shadow: { enabled: true, color: 'rgba(0,0,0,0.5)', size: 8, x: 2, y: 4 }
        },
        edges: {
          color: { color: 'rgba(148, 163, 184, 0.4)', highlight: '#818cf8', hover: '#a5b4fc' },
          width: 1.5,
          smooth: { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.5 }
        },
        layout: {
          hierarchical: {
            enabled: true,
            direction: 'UD',
            sortMethod: 'directed',
            levelSeparation: 80, // Aumentata distanza verticale tra i livelli
            nodeSpacing: 250,     // Aumentata distanza orizzontale tra nodi vicini
            treeSpacing: 300,     // Aumentata distanza tra rami differenti
            blockShifting: true,
            parentCentralization: true
          }
        },
        physics: { enabled: false },
        interaction: { hover: true, zoomView: true, dragNodes: true }
      };

      const network = new vis.Network(container, data, options);

      // Elementi UI Pannello
      const panel = document.getElementById('side-panel');
      const panelTitle = document.getElementById('panel-title');
      const panelSubtitle = document.getElementById('panel-subtitle');
      const panelSummary = document.getElementById('panel-summary');
      const panelTags = document.getElementById('panel-tags');
      const panelLinks = document.getElementById('panel-links');
      const closeBtn = document.getElementById('close-btn');

      // Popola il pannello iniziale
      updatePanel('me');

      // 4. Gestione Click sui nodi
      network.on('click', (params) => {
        if (params.nodes.length > 0) {
          const clickedId = params.nodes[0];

          network.focus(clickedId, {
            scale: 1.05,
            animation: { duration: 400, easingFunction: 'easeInOutQuad' }
          });

          updatePanel(clickedId);
          panel.classList.remove('closed');
        }
      });

      closeBtn.addEventListener('click', () => panel.classList.add('closed'));

      // 5. Funzione Aggiornamento Dettagli Pannello
      function updatePanel(nodeId) {
        const detail = graphData.details[nodeId] || {
          title: nodeId,
          subtitle: 'Dettaglio Tecnico',
          tags: [],
          summaryEN: 'No details available.',
          summaryIT: 'Nessun dettaglio disponibile.',
          links: []
        };

        panelTitle.textContent = detail.title;
        panelSubtitle.textContent = detail.subtitle;

        const textEN = (detail.summaryEN || (typeof detail.summary === 'string' ? detail.summary : '')).replace(/\n/g, '<br>');
        const textIT = (detail.summaryIT || '').replace(/\n/g, '<br>');

        if (textIT) {
          panelSummary.innerHTML = `
            <div class="mb-4">
              <span class="inline-block px-2 py-0.5 mb-2 text-[10px] font-bold tracking-wider text-indigo-300 bg-indigo-950/80 rounded border border-indigo-800/60 uppercase">EN</span>
              <p class="text-slate-300 text-sm leading-relaxed">${textEN}</p>
            </div>
            <div class="pt-4 border-t border-slate-800">
              <span class="inline-block px-2 py-0.5 mb-2 text-[10px] font-bold tracking-wider text-emerald-300 bg-emerald-950/80 rounded border border-emerald-800/60 uppercase">IT</span>
              <p class="text-slate-400 text-sm leading-relaxed">${textIT}</p>
            </div>
          `;
        } else {
          panelSummary.innerHTML = `<p class="text-slate-300 text-sm leading-relaxed">${textEN}</p>`;
        }

        panelTags.innerHTML = (detail.tags || []).map(tag => 
          `<span class="px-2.5 py-1 text-xs font-medium rounded-md bg-slate-800 text-indigo-300 border border-slate-700/50">${tag}</span>`
        ).join('');

        if (detail.links && detail.links.length > 0) {
          panelLinks.innerHTML = detail.links.map(link => 
            `<a href="${link.url}" target="_blank" class="flex items-center justify-between p-3 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-xs text-indigo-400 font-medium transition border border-slate-700/40 hover:border-indigo-500/50">
              <span>${link.label}</span>
              <span>↗</span>
            </a>`
          ).join('');
        } else {
          panelLinks.innerHTML = `<span class="text-xs text-slate-500 italic">Nessun link esterno.</span>`;
        }
      }
    });
  </script>
</body>
</html>
